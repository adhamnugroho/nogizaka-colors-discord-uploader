name: Code Quality & Syntax Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Syntax Compilation Check
      run: |
        python -m compileall -q src scripts main.py

    - name: Lint with Flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 src scripts main.py --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Max line length set to 127
        flake8 src scripts main.py --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v
